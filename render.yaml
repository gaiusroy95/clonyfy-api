# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this Backend repo in the Render dashboard (or apply this blueprint).

services:
  - type: web
    name: clonyfy-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLONYFY_HOSTED
        value: "1"
      - key: CLONYFY_FAST_CLONE
        value: "1"
      # Free/Starter: concurrency 1 avoids Chromium OOM. Raise to 2+ on more RAM.
      - key: CLONYFY_CLONE_CONCURRENCY
        value: "1"
      - key: CLONYFY_LOW_MEMORY
        value: "1"
      # Optional: mount a persistent disk and set CLONYFY_OUTPUT_DIR to that path.
      # - key: CLONYFY_OUTPUT_DIR
      #   value: /var/data/output
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PASSWORD_PEPPER
        sync: false
      - key: SHARE_PASSWORD_PEPPER
        sync: false
      - key: APP_URL
        sync: false
      # Must be the live Frontend origin (CORS + redirects), e.g. https://www.clonyfy.com
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FIGMA_COMMUNITY_PLUGIN_URL
        sync: false
